Name: GlucoDroid
Summary: CGM relay and display for FreeStyle Libre & Dexcom
Description: |-
  GlucoDroid is an open-source continuous glucose monitor (CGM) companion app
  supporting FreeStyle Libre 2/3 and Dexcom sensors. It reads glucose values
  directly from the sensor and can relay them via glucodroid.cloud to caregivers,
  Nightscout, and other integrations.

  This is a community fork of JugglucoNG, rebranded for the glucodroid.cloud
  infrastructure. The cloud relay is free to use. GlucoDroid is not a medical
  device and is not intended for treatment decisions.

  Features:
  * Direct Bluetooth reading from Libre 2/3 and Dexcom sensors
  * Glucose alarms with configurable thresholds
  * WearOS companion support
  * Nightscout / glucodroid.cloud relay
  * No ads, no tracking, no data sold

AntiFeatures:
  NonFreeNet:
    en-US: The default relay backend (glucodroid.cloud) runs proprietary server
      software while it undergoes security hardening. A self-hosted open-source
      backend is planned. The app works without the relay for local display only.

